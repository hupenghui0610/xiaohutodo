# Cloudflare Pages 配置
# 部署时自动使用此配置

[env.production]
# 生产环境配置

# D1 数据库绑定
# 注意：创建数据库后，将 database_id 替换为实际的数据库 ID
[[env.production.d1_databases]]
binding = "DB"
database_name = "xiaohutodo-db"
database_id = "f305b54c-b68f-49ed-ba32-f36b43ce014e"

[env.development]
# 本地开发环境配置

[[env.development.d1_databases]]
binding = "DB"
database_name = "xiaohutodo-db-dev"
database_id = "your-dev-database-id-here"
